name: Build GunZ Client

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgGitHubLogin: ${{ secrets.VCPKG_GITHUB_LOGIN }}
        vcpkgGitHubToken: ${{ secrets.GITHUB_TOKEN }}
        vcpkgBranch: 'master'
        vcpkgArgs: 'install openssl:x64-windows zlib:x64-windows'

    - name: Configure CMake
      shell: cmd
      run: |
        cd ogz-source
        if not exist build\x64 mkdir build\x64
        cd build\x64
        cmake -G "Visual Studio 17 2022" -A x64 -Wno-dev -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE=%cd:0=%\..\vcpkg\scripts\buildsystems\vcpkg.cmake ..\..\src

    - name: Build
      shell: cmd
      run: |
        cd ogz-source\build\x64
        cmake --build . --config Release --target INSTALL

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GunZ-Client-Windows-x64
        path: ogz-source/install/client/
        retention-days: 7

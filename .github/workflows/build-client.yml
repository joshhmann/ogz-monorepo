name: Build GunZ Client

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

jobs:
  build-client:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      shell: cmd
      working-directory: ogz-source
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 -Wno-dev -DBUILD_SHARED_LIBS=OFF ..\src

    - name: Build client
      shell: cmd
      working-directory: ogz-source/build
      run: |
        cmake --build . --config Release --parallel

    - name: Find output
      shell: powershell
      working-directory: ogz-source
      run: |
        Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName, Length

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GunZ-Client-Windows-x64
        path: ogz-source/
        retention-days: 7
        patterns: "**/Release/**/*.exe"
